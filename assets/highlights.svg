<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="180" viewBox="0 0 1100 180" role="img" aria-label="Highlights: 3+ years of experience, 4 professional roles, 14 high-fidelity builds, and 2 computer science programs">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="accent3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accent4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <style>
    .label { font-family: Segoe UI, Ubuntu, Helvetica, Arial, sans-serif; font-size: 13px; fill: #94a3b8; }
    .value { font-family: Segoe UI, Ubuntu, Helvetica, Arial, sans-serif; font-size: 36px; font-weight: 700; fill: #f1f5f9; }
    .sub { font-family: Segoe UI, Ubuntu, Helvetica, Arial, sans-serif; font-size: 12px; fill: #64748b; }
    .card { opacity: 0; animation: fadeUp 0.8s ease forwards; }
    .c2 { animation-delay: 0.12s; }
    .c3 { animation-delay: 0.24s; }
    .c4 { animation-delay: 0.36s; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
  <rect width="1100" height="180" rx="20" fill="#0b1220"/>
  <g class="card">
    <rect x="24" y="28" width="250" height="124" rx="16" fill="url(#cardBg)" stroke="#1e293b"/>
    <rect x="24" y="28" width="250" height="4" rx="2" fill="url(#accent1)"/>
    <text x="149" y="92" text-anchor="middle" class="value">3+</text>
    <text x="149" y="118" text-anchor="middle" class="label">Years of experience</text>
    <text x="149" y="136" text-anchor="middle" class="sub">Since Mar 2023</text>
  </g>
  <g class="card c2">
    <rect x="291" y="28" width="250" height="124" rx="16" fill="url(#cardBg)" stroke="#1e293b"/>
    <rect x="291" y="28" width="250" height="4" rx="2" fill="url(#accent2)"/>
    <text x="416" y="92" text-anchor="middle" class="value">4</text>
    <text x="416" y="118" text-anchor="middle" class="label">Professional roles</text>
    <text x="416" y="136" text-anchor="middle" class="sub">Devitron &#183; Freelance &#183; HeLLLoDEV</text>
  </g>
  <g class="card c3">
    <rect x="558" y="28" width="250" height="124" rx="16" fill="url(#cardBg)" stroke="#1e293b"/>
    <rect x="558" y="28" width="250" height="4" rx="2" fill="url(#accent3)"/>
    <text x="683" y="92" text-anchor="middle" class="value">14</text>
    <text x="683" y="118" text-anchor="middle" class="label">High-fidelity builds</text>
    <text x="683" y="136" text-anchor="middle" class="sub">Portfolio case studies</text>
  </g>
  <g class="card c4">
    <rect x="825" y="28" width="250" height="124" rx="16" fill="url(#cardBg)" stroke="#1e293b"/>
    <rect x="825" y="28" width="250" height="4" rx="2" fill="url(#accent4)"/>
    <text x="950" y="92" text-anchor="middle" class="value">2</text>
    <text x="950" y="118" text-anchor="middle" class="label">CS programs</text>
    <text x="950" y="136" text-anchor="middle" class="sub">BSCS 2023&#8211;2027</text>
  </g>
</svg>
