<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-label="Career and education timeline from 2023 to 2027: Team Lead and Senior Frontend Engineer at Devitron Solutions, Web Engineer at Freelance, Frontend Developer at HeLLLoDEV, and BS Computer Science at Virtual University of Pakistan and COMSATS University">
  <defs>
    <linearGradient id="rail" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <style>
    .title { font-family: Segoe UI, Ubuntu, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #f1f5f9; }
    .date { font-family: Segoe UI, Ubuntu, Helvetica, Arial, sans-serif; font-size: 12px; fill: #94a3b8; }
    .kind { font-family: Segoe UI, Ubuntu, Helvetica, Arial, sans-serif; font-size: 11px; fill: #67e8f9; letter-spacing: 1px; }
    .bar { transform: scaleX(0.12); opacity: 0.4; transform-box: fill-box; transform-origin: left center; animation: grow 1.2s ease forwards; }
    .b2 { animation-delay: 0.15s; }
    .b3 { animation-delay: 0.3s; }
    .b4 { animation-delay: 0.45s; }
    .b5 { animation-delay: 0.6s; }
    .b6 { animation-delay: 0.75s; }
    @keyframes grow {
      from { transform: scaleX(0.12); opacity: 0.4; }
      to { transform: scaleX(1); opacity: 1; }
    }
  </style>
  <rect width="1100" height="600" rx="20" fill="#0b1220"/>
  <text x="1060" y="42" text-anchor="end" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" letter-spacing="2">2023 &#8212; 2027</text>
  <rect x="52" y="60" width="4" height="500" rx="2" fill="url(#rail)"/>

  <circle cx="54" cy="101" r="8" fill="#3b82f6">
    <animate attributeName="r" values="8;10;8" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <rect class="bar" x="86" y="72" width="960" height="58" rx="12" fill="#111827" stroke="#1e3a8a"/>
  <rect class="bar" x="86" y="72" width="8" height="58" rx="4" fill="#3b82f6"/>
  <text x="112" y="94" class="kind">WORK</text>
  <text x="112" y="114" class="title">Team Lead &#8212; Devitron Solutions</text>
  <text x="1020" y="106" text-anchor="end" class="date">Sep 2025 &#8211; Present</text>

  <circle cx="54" cy="187" r="7" fill="#6366f1"/>
  <rect class="bar b2" x="86" y="158" width="960" height="58" rx="12" fill="#111827" stroke="#312e81"/>
  <rect class="bar b2" x="86" y="158" width="8" height="58" rx="4" fill="#8b5cf6"/>
  <text x="112" y="180" class="kind">WORK</text>
  <text x="112" y="200" class="title">Senior Frontend Engineer &#8212; Devitron Solutions</text>
  <text x="1020" y="192" text-anchor="end" class="date">Dec 2024 &#8211; Sep 2026</text>

  <circle cx="54" cy="273" r="7" fill="#8b5cf6"/>
  <rect class="bar b3" x="86" y="244" width="960" height="58" rx="12" fill="#111827" stroke="#4c1d95"/>
  <rect class="bar b3" x="86" y="244" width="8" height="58" rx="4" fill="#a78bfa"/>
  <text x="112" y="266" class="kind">WORK</text>
  <text x="112" y="286" class="title">Web Engineer &#8212; Freelance</text>
  <text x="1020" y="278" text-anchor="end" class="date">Sep 2023 &#8211; Oct 2024</text>

  <circle cx="54" cy="359" r="7" fill="#a78bfa"/>
  <rect class="bar b4" x="86" y="330" width="960" height="58" rx="12" fill="#111827" stroke="#4c1d95"/>
  <rect class="bar b4" x="86" y="330" width="8" height="58" rx="4" fill="#c4b5fd"/>
  <text x="112" y="352" class="kind">WORK</text>
  <text x="112" y="372" class="title">Frontend Developer &#8212; HeLLLoDEV</text>
  <text x="1020" y="364" text-anchor="end" class="date">Mar 2023 &#8211; Jul 2023</text>

  <circle cx="54" cy="445" r="7" fill="#14b8a6"/>
  <rect class="bar b5" x="86" y="416" width="960" height="58" rx="12" fill="#111827" stroke="#115e59"/>
  <rect class="bar b5" x="86" y="416" width="8" height="58" rx="4" fill="#14b8a6"/>
  <text x="112" y="438" class="kind">STUDIES</text>
  <text x="112" y="458" class="title">BS Computer Science &#8212; Virtual University of Pakistan</text>
  <text x="1020" y="450" text-anchor="end" class="date">2024 &#8211; 2027</text>

  <circle cx="54" cy="531" r="7" fill="#22d3ee"/>
  <rect class="bar b6" x="86" y="502" width="960" height="58" rx="12" fill="#111827" stroke="#155e75"/>
  <rect class="bar b6" x="86" y="502" width="8" height="58" rx="4" fill="#22d3ee"/>
  <text x="112" y="524" class="kind">STUDIES</text>
  <text x="112" y="544" class="title">BS Computer Science &#8212; COMSATS University</text>
  <text x="1020" y="536" text-anchor="end" class="date">2023 &#8211; 2024</text>
</svg>
